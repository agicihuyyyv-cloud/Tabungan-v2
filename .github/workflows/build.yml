name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ls -la
          echo "--- unzip ---"
          unzip -o tabungan-app.zip || unzip -o "*.zip" || echo "ZIP TIDAK KETEMU!"
          echo "--- hasil ---"
          ls -la
          find . -maxdepth 4 -type f | grep -E "gradle|settings" | head -30
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK Auto
        run: |
          FILE=$(find . -name "settings.gradle*" -type f | head -1)
          if [ -z "$FILE" ]; then FILE=$(find . -name "gradlew" -type f | head -1); fi
          echo "File found: $FILE"
          if [ -z "$FILE" ]; then
            echo "GAGAL, gak ada settings.gradle / gradlew"
            ls -R | head -100
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Build dir: $DIR"
          cd $DIR
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tabungan-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
