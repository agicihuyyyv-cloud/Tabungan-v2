name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          rm -rf tabungan-app
          unzip -o tabungan-app.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build APK
        run: |
          cd tabungan-app
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          npx cap init Tabungan com.tabungan.app --web-dir=dist
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tabungan-APK
          path: tabungan-app/android/app/build/outputs/apk/debug/*.apk
