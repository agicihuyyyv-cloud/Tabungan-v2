name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o tabungan-app.zip
          ls -la
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug
          build-root-directory: tabungan-app
      - uses: actions/upload-artifact@v4
        with:
          name: tabungan-APK
          path: tabungan-app/app/build/outputs/apk/debug/*.apk
