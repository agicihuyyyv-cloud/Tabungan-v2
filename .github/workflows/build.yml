name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o tabungan-app.zip || unzip -o Tabungan-Android.zip || unzip -o "*.zip"
          echo "=== HASIL UNZIP ==="
          ls -la
          echo "=== CARI FILE GRADLE ==="
          find . -maxdepth 4 -name "settings.gradle*" -o -name "gradlew"
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK Auto
        run: |
          PROJECT=$(find . -type f -name "settings.gradle*" | head -1 | xargs dirname 2>/dev/null)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -type f -name "gradlew" | head -1 | xargs dirname 2>/dev/null)
          fi
          if [ -z "$PROJECT" ]; then
            echo "GAGAL NEMU PROJECT, isi folder:"
            ls -R | head -200
            exit 1
          fi
          echo "Project found at: $PROJECT"
          cd $PROJECT
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tabungan-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
