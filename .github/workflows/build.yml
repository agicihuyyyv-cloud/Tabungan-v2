name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o tabungan-app.zip
          echo "=== LIHAT STRUKTUR ==="
          ls -R | head -100
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK Auto
        run: |
          PROJECT=$(find . -name "settings.gradle" | head -1 | xargs dirname)
          echo "Project found at: $PROJECT"
          cd $PROJECT
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tabungan-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
